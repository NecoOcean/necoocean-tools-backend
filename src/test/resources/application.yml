spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:necoocean_tools;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      connection-init-sql: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate.auto_quote_keyword: true
  flyway:
    enabled: false

logging:
  config: classpath:logback-test.xml

tools:
  security:
    ip-hash-salt: test-ip-salt
