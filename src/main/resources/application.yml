server:
  # 只监听回环地址，公网入口是 Nginx。本机调试访问 http://127.0.0.1:8080
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 12h
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
        max-age: 12h
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: necoocean-tools
  # 库需事先建好，脚本见 db/create_database.sql。表由 Flyway 创建。
  # 生产环境用 DB_URL、DB_USERNAME、DB_PASSWORD 覆盖下面的本机默认值。
  # 管理员口令不写进本文件。本机口令在 config/local.yml（不进仓库）。
  # 库里还没有账号时，用其中的 ADMIN_USERNAME（默认 admin）和 ADMIN_PASSWORD 创建一次。
  config:
    import: optional:file:./config/local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/necoocean_tools?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: com.necoocean.tools.config.MysqlToolsDialect
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
      hibernate.auto_quote_keyword: true
  flyway:
    enabled: true
    clean-disabled: true
    encoding: UTF-8
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Shanghai
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 后端不托管页面和静态资源，避免未命中路径落到资源处理器后返回 HTML
      add-mappings: false

tools:
  security:
    # 与客户端 IP 拼接后再做 SHA-256。生产环境用 IP_HASH_SALT 覆盖，不要沿用这个开发默认值。
    ip-hash-salt: ${IP_HASH_SALT:dev-only-ip-salt}
